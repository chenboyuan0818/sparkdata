# 场景：曝光很大但进不来人 —— 流量环节（进入率）低于健康基准，下游全部正常
# 标准答案由人工独立推导，不取自系统输出（否则是循环论证）
name: 流量环节异常
description: 进入率 4%，低于 5% 的健康下限；停留、点击、转化均达标

# 手算过程（可逐项复核）：
#   进入率     = (4000+4000) / (100000+100000) = 8000/200000   = 0.04
#   平均停留   = mean(60, 60)                                   = 60
#   商品点击率 = (800+800) / 8000                = 1600/8000    = 0.20
#   成交转化率 = (100+100) / 1600                = 200/1600     = 0.125
#   UV价值     = (20000+20000) / 8000            = 40000/8000   = 5.0
#   客单价     = 40000 / 200                                    = 200.0
expected_metrics:
  总曝光人数: 200000
  总进入人数: 8000
  总GMV: 40000
  进入率: 0.04
  平均停留秒数: 60
  商品点击率: 0.20
  成交转化率: 0.125
  UV价值: 5.0
  客单价: 200.0

# 阈值判定 —— 检验按漏斗顺序定位瓶颈的逻辑是否正确
expected_flags:
  流量环节异常: true
  留人环节异常: false
  商品环节异常: false
  转化环节异常: false

expected_diagnosis:
  bottleneck: 流量
  keywords_any: [进入率, 流量, 封面, 标题, 曝光]

expected_actions:
  keywords_any: [封面, 标题, 开播时段, 投流, 推荐, 违规]

# 出现即判失败：无可执行性的空话
must_not_contain: [提升转化率即可, 优化用户体验即可]
