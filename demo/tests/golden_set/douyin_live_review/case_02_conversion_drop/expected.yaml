# 场景：流量与留人都正常，卡在最后的成交环节
name: 转化环节异常
description: 成交转化率 5%，低于 8% 的健康下限；上游三个环节均达标

# 手算过程：
#   进入率     = 20000/200000  = 0.10
#   平均停留   = 60
#   商品点击率 = 4000/20000    = 0.20
#   成交转化率 = 200/4000      = 0.05   ← 低于 0.08
#   UV价值     = 40000/20000   = 2.0
#   客单价     = 40000/200     = 200.0
expected_metrics:
  总曝光人数: 200000
  总进入人数: 20000
  总GMV: 40000
  进入率: 0.10
  平均停留秒数: 60
  商品点击率: 0.20
  成交转化率: 0.05
  UV价值: 2.0
  客单价: 200.0

expected_flags:
  流量环节异常: false
  留人环节异常: false
  商品环节异常: false
  转化环节异常: true

expected_diagnosis:
  bottleneck: 转化
  keywords_any: [转化, 成交, 下单, 价格, 犹豫, 促单]

expected_actions:
  keywords_any: [促单, 优惠, 价格, 话术, 库存, 紧迫]

must_not_contain: [提升转化率即可, 优化用户体验即可]
