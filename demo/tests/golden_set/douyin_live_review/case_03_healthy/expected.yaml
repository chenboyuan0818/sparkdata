# 场景：所有环节均达标。用来检验系统会不会「没病硬说有病」——
# 一个总在报警的分析工具，和一个从不报警的一样没用
name: 全部达标（负样本）
description: 四个环节全部高于健康基准，不应报出任何环节异常

# 手算过程：
#   进入率     = 20000/200000  = 0.10
#   平均停留   = 90
#   商品点击率 = 5000/20000    = 0.25
#   成交转化率 = 750/5000      = 0.15
#   UV价值     = 150000/20000  = 7.5
#   客单价     = 150000/750    = 200.0
expected_metrics:
  总曝光人数: 200000
  总进入人数: 20000
  总GMV: 150000
  进入率: 0.10
  平均停留秒数: 90
  商品点击率: 0.25
  成交转化率: 0.15
  UV价值: 7.5
  客单价: 200.0

expected_flags:
  流量环节异常: false
  留人环节异常: false
  商品环节异常: false
  转化环节异常: false

expected_diagnosis:
  bottleneck: 无
  keywords_any: [达标, 健康, 正常, 均高于, 无明显]

expected_actions:
  keywords_any: []

must_not_contain: []
